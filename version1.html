<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda en Línea</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-top: 70px;
        }
        .sticky-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: white;
            padding: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px; /* Altura fija para el header */
        }
        .search-bar {
            display: flex;
            align-items: center;
        }
        .search-bar input {
            padding: 8px;
            width: 60%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .search-bar button {
            padding: 8px 12px;
            margin-left: 10px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        .nav-buttons button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: black;
        }
        .carousel {
            margin-top: 0px;
            text-align: center;
        }
        .carousel-container {
            position: relative;
            max-width: 100%;
            overflow: hidden;
            margin-top: 20px;
        }
        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }
        .carousel-slide {
            width: 100%;
            height: 600px;
            display: block;
            object-fit: cover;
            flex-shrink: 0;
        }
        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 30px;
            cursor: pointer;
            padding: 10px;
            z-index: 10; /* Asegura que los botones estén por encima del carrusel */
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
        }
        .product {
            width: 30%;
            margin: 10px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            background: white;
        }
        .product img {
            max-width: 100%;
            border-radius: 5px;
        }
        .product h3 {
            font-weight: bold;
        }
        .price {
            font-size: 1.2em;
            color: #28a745;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<header class="sticky-header">
    <div class="search-bar">
        <input type="text" placeholder="Buscar productos...">
        <button>Buscar</button>
    </div>
    <div class="nav-buttons">
        <a href="index.html"><button>Groupbuy</button></a>
        <a href="conocenos.html"><button>¿Primera vez?</button></a>
        <button>Contáctanos</button>
        <button>Devoluciones y pedidos</button>
    </div>
</header>

<section class="carousel">
    <div class="carousel-container">
        <div class="slides">
            <img src="ad1.jpg" alt="Anuncio 1" class="carousel-slide">
            <img src="ad2.jpg" alt="Anuncio 2" class="carousel-slide">
            <img src="ad3.jpg" alt="Anuncio 3" class="carousel-slide">
        </div>
        <button class="prev carousel-button" onclick="moveSlide(-1)">&#10094;</button>
        <button class="next carousel-button" onclick="moveSlide(1)">&#10095;</button>
    </div>
</section>

<section class="products">
    <div class="product" onclick="location.href='producto.html'">
        <img src="producto1.jpg" alt="Producto 1">
        <h3>Producto 1</h3>
        <p class="price">$100.00</p>
        <p class="description">Descripción breve del producto 1.</p>
    </div>
    <div class="product" onclick="location.href='producto.html'">
        <img src="producto2.jpg" alt="Producto 2">
        <h3>Producto 2</h3>
        <p class="price">$200.00</p>
        <p class="description">Descripción breve del producto 2.</p>
    </div>
    <div class="product" onclick="location.href='producto.html'">
        <img src="producto3.jpg" alt="Producto 3">
        <h3>Producto 3</h3>
        <p class="price">$300.00</p>
        <p class="description">Descripción breve del producto 3.</p>
    </div>
    <!-- Más productos -->
</section>

<footer>
    <p>¿Te gusto nuestra pagina de brueba? Dejanos saber tu <a href="https://docs.google.com/forms/d/e/1FAIpQLSfC0a_GMhXmJ7MnayyRXMIS0dgtsgplD6wApTL3CHppFwW7Uw/viewform" style="color: #007bff; text-decoration: none;">opinión</a>.</p>
</footer>

<script>
    window.addEventListener('scroll', function() {
        const header = document.querySelector('.sticky-header');
        if (window.scrollY > 0) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });
    let currentSlide = 0;
    const slides = document.querySelectorAll('.carousel-slide');

    function showSlide(index) {
        if (index >= slides.length) {
            currentSlide = 0;
        } else if (index < 0) {
            currentSlide = slides.length - 1;
        } else {
            currentSlide = index;
        }

        const slideWidth = slides[0].clientWidth;
        document.querySelector('.slides').style.transform = `translateX(-${slideWidth * currentSlide}px)`;
    }

    function moveSlide(direction) {
        showSlide(currentSlide + direction);
    }

    // Inicializar el carrusel
    showSlide(currentSlide);

    // Si deseas que el carrusel avance automáticamente cada cierto tiempo:
    setInterval(() => {
        moveSlide(1);
    }, 5000);  // Cambia la imagen cada 5 segundos
</script>
</body>
</html>
